<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">◉</span>
          <h1>Claude <em>Explorer</em></h1>
        </div>
        <div class="topbar-meta">
          <span id="scanned-at" class="meta-pill">never scanned</span>
          <button id="rescan" class="btn">↻ Rescan</button>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button class="tab active" data-view="overview">Overview</button>
        <button class="tab" data-view="config">Config</button>
        <button class="tab" data-view="skills">Skills</button>
        <button class="tab" data-view="projects">Projects</button>
        <button class="tab" data-view="permissions">Permissions</button>
        <button class="tab" data-view="mcp">MCP &amp; Hooks</button>
        <button class="tab" data-view="agents">Agents &amp; Commands</button>
      </nav>

      <main id="content" class="content">
        <div class="loading">Scanning your filesystem…</div>
      </main>

      <footer class="footer">
        <span id="footer-path">~/.claude</span>
        <span class="footer-sep">·</span>
        <span id="footer-warnings">0 warnings</span>
      </footer>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
